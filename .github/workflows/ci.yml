name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, lint and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: extractions/setup-just@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - run: just check
      - run: just lint
      - run: just test

  e2e:
    name: End to end
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/e2e
      - uses: extractions/setup-just@v2
      - run: pnpm install --frozen-lockfile
      - run: just test-e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-homes
          path: /tmp/cn*/app.log
          if-no-files-found: ignore
